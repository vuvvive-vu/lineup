<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preload" href="/fonts/CoralineCat.ttf" as="font" type="font/ttf" crossorigin>
<title>Верификация — togetherly</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:24px;">
  <div style="text-align:center;max-width:400px;">
    <div id="loading" style="font-size:14px;color:#9a9a9a;">Проверяем ссылку...</div>
    <div id="success" style="display:none;">
      <div style="font-size:48px;margin-bottom:16px;">✅</div>
      <h2 style="font-size:22px;font-weight:700;margin-bottom:8px;">Почта подтверждена</h2>
      <p style="color:#9a9a9a;font-size:14px;margin-bottom:24px;">Теперь можно войти в аккаунт</p>
      <a href="/" style="display:inline-block;background:#fff;color:#000;padding:12px 32px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;">На главную</a>
    </div>
    <div id="error" style="display:none;">
      <div style="font-size:48px;margin-bottom:16px;">❌</div>
      <h2 style="font-size:22px;font-weight:700;margin-bottom:8px;">Ошибка</h2>
      <p style="color:#9a9a9a;font-size:14px;margin-bottom:24px;">Ссылка недействительна или уже использована</p>
      <a href="/" style="display:inline-block;background:#fff;color:#000;padding:12px 32px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;">На главную</a>
    </div>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
if(params.get('verified')==1){document.getElementById('loading').style.display='none';document.getElementById('success').style.display='block';}
else{document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';}
</script>
</body>
</html>
