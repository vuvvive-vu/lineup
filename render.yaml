services:
  - type: web
    name: lineup
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lineup-db
          property: connectionString
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@togetherly.online
      - key: SITE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: VK_SERVICE_TOKEN
        sync: false
    healthCheckPath: /

databases:
  - name: lineup-db
    plan: free
    databaseName: lineup
